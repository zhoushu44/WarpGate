[workspace]
resolver = "2"
members = [
    "crates/wg-core",
    "crates/wg-config",
    "crates/wg-store",
    "crates/wg-socks",
    "crates/wg-tunnel",
    "crates/wg-pool",
    "crates/wg-apiserver",
    "crates/wg-bin",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "net", "io-util", "signal"] }
axum = { version = "0.8", features = ["query"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
once_cell = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
