[package]
name = "wg-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
wg-core = { path = "../wg-core" }
wg-store = { path = "../wg-store" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# MASQUE 数据面（Phase 3）
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-pki-types = { version = "1", features = ["alloc"] }
x509-parser = { version = "0.16", features = ["verify"] }
rcgen = "0.13"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
sec1 = { version = "0.8", features = ["der", "alloc"] }
base64 = "0.22"
getrandom = "0.2"
h3 = "0.0.7"
h3-quinn = "0.0.9"
http = "1"
bytes = "1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http2", "tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
