services:
  warpgate:
    # 镜像由 GitHub Actions 在 push 到 main/master 时构建推送。
    # 升级：docker compose pull && docker compose up -d
    # 固定版本可把 latest 换成具体版本号，例如 zhoushu1/warp-pool:0.11.0
    image: zhoushu1/warp-pool:latest
    container_name: warpgate
    # host 网络：实例 SOCKS5 端口段（10010 起）+ 管理台 4433 直接暴露。
    # MASQUE 走 TCP 443 出站，不需要额外 UDP 映射；host 模式避免
    # 上千个端口逐个 publish 的开销。
    network_mode: host
    restart: unless-stopped
    environment:
      # quic  = 用 usque 子进程建 MASQUE 隧道（UDP 443 被封的机房必须用这个）
      # h2    = Rust 原生 CONNECT-IP over TCP 443（省内存，无需子进程）
      WARP_NATIVE: quic
      RUST_LOG: info
    volumes:
      # 实例数据：每个实例一个目录（usque.json + 元数据）
      - /root/warpgate-rs/instances:/root/warpgate-rs/instances
      # 配置：运行期会写回（端口、白名单等），需读写
      - /root/warpgate-rs/rust-config.json:/app/config.json
    # tini 已是 ENTRYPOINT，这里只约束资源上限，避免异常时吃满宿主机
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
